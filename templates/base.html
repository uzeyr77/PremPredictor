<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Premier League Predictor{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

<!-- so the child templates can have their own styling-->
    {% block styles %}{% endblock %}
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
            <div class="container-fluid">
<!--                clicking the logo/name takes back to the index page, url_for("index") returns / so takes back to landing/home_page-->
                <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">PremPredictor</a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('predictions') }}">Predictions</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('scenario') }}">Scenario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('accuracy') }}">Accuracy</a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center text-muted small">
                        2025/2026 Season — Last Updated: {{ last_updated if last_updated else "N/A" }}
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
